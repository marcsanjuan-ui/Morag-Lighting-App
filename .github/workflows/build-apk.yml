# Builds the MORAG Lighting APK on GitHub's servers.
# Push this repo to GitHub, then: Actions tab -> "Build APK" -> Run workflow.
# When it finishes, download "morag-lighting-apk" from the run's Artifacts.
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Adds the Android project files; keeps lib/, test/ and our AndroidManifest.xml
      - name: Create Android project files
        run: flutter create --platforms=android --org com.morag --project-name morag_lighting .

      # Make sure our manifest (cleartext HTTP + Wi-Fi permissions) is the one used
      - name: Check manifest
        run: grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: morag-lighting-apk
          path: app/build/outputs/flutter-apk/app-release.apk
